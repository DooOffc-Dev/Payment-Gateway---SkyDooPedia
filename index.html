<!DOCTYPE html>
<html lang="id" x-data="paymentApp()">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Gateway - DooPedia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['Space Mono', 'monospace'],
          },
          colors: {
            brand: {
              50:  '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>

  <style>
    body { background: #0f172a; }
    .glass {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
    }
    .input-field {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #f1f5f9;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-field:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.15);
    }
    .input-field::placeholder { color: #475569; }
    .select-field {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #f1f5f9;
    }
    .select-field:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.15);
    }
    .select-field option { background: #1e293b; color: #f1f5f9; }

    .btn-pay {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      transition: all .2s;
      box-shadow: 0 4px 20px rgba(34,197,94,0.3);
    }
    .btn-pay:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(34,197,94,0.4);
    }
    .btn-pay:disabled { opacity: .5; cursor: not-allowed; }

    .method-badge {
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.2);
      color: #4ade80;
    }

    .result-card {
      animation: slideUp .4s ease;
    }
    @keyframes slideUp {
      from { opacity:0; transform: translateY(16px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .pulse-dot {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .4; }
    }

    /* QR code area */
    .qr-code-text {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      word-break: break-all;
      line-height: 1.5;
    }

    label { color: #94a3b8; font-size: .8rem; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
  </style>
</head>

<body class="font-sans min-h-screen flex items-start justify-center py-12 px-4">

  <!-- Background Decoration -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 rounded-full" style="background: radial-gradient(circle, rgba(34,197,94,0.08) 0%, transparent 70%)"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 rounded-full" style="background: radial-gradient(circle, rgba(59,130,246,0.06) 0%, transparent 70%)"></div>
  </div>

  <div class="w-full max-w-lg relative z-10">

    <!-- Header -->
    <div class="mb-8 text-center">
      <div class="inline-flex items-center gap-2 mb-3 px-3 py-1 rounded-full text-xs font-mono method-badge">
        <span class="pulse-dot inline-block w-1.5 h-1.5 rounded-full bg-green-400"></span>
        PAYMENT GATEWAY
      </div>
      <h1 class="text-3xl font-bold text-white tracking-tight">Buat Transaksi</h1>
      <p class="text-slate-400 mt-1 text-sm">Isi form di bawah untuk membuat pembayaran baru</p>
    </div>

    <!-- FORM CARD -->
    <div class="glass rounded-2xl p-6 mb-5" x-show="!result">


      <!-- Payment Method -->
      <div class="mb-5 pb-5 border-b border-white/5">
        <p class="text-xs font-mono text-green-400 mb-3 uppercase tracking-widest">💳 Metode Pembayaran</p>
        <div>
          <label class="block mb-1">Bank / E-Wallet / QRIS</label>
          <select x-model="form.bank_code" class="select-field w-full rounded-lg px-3 py-2.5 text-sm appearance-none cursor-pointer">
            <option value="">-- Pilih Metode --</option>
            <optgroup label="QRIS">
              <option value="SP">QRIS</option>
              <option value="NQ">QRIS 2</option>
            </optgroup>
            <optgroup label="E-Wallet">
              <option value="DA">DANA</option>
              <option value="OV">OVO</option>
              <option value="LA">LinkAja</option>
              <option value="SA">ShopeePay</option>
              <option value="SHOPEEPAY">SHOPEEPAY2</option>
              <option value="GOPAY">GOPAY</option>
              <option value="VIRGO">VIRGO</option>
            </optgroup>
            <optgroup label="Bank Virtual Account">
              <option value="BR">BRI</option>
              <option value="BCAVA">BCA</option>
              <option value="I1">BNI</option>
              <option value="M2">Mandiri</option>
              <option value="BT">Permata</option>
              <option value="VA">Maybank</option>
              <option value="DM">Danamon</option>
              <option value="B1">CIMB Niaga</option>
              <option value="NC">NeoBank</option>
              <option value="A1">ATM Bersama</option>
              <option value="BV">BSI</option>
            </optgroup>
            <optgroup label="Retail">
              <option value="FT">Pegadaian / ALFA / Pos</option>
              <option value="INDOMARET">INDOMARET</option>
            </optgroup>
          </select>
        </div>
      </div>

      <!-- Customer & Transaction Info -->
      <div class="mb-5 pb-5 border-b border-white/5">
        <p class="text-xs font-mono text-green-400 mb-3 uppercase tracking-widest">👤 Data Transaksi</p>
        <div class="grid grid-cols-1 gap-3">
          <div>
            <label class="block mb-1">Jumlah (Rp)</label>
            <input type="number" x-model="form.amount" placeholder="Contoh: 100000"
              class="input-field w-full rounded-lg px-3 py-2.5 text-sm"/>
          </div>
          <div>
            <label class="block mb-1">Nama Customer</label>
            <input type="text" x-model="form.customer_name" placeholder="Jhon Doe"
              class="input-field w-full rounded-lg px-3 py-2.5 text-sm"/>
          </div>
          <div>
            <label class="block mb-1">Email Customer</label>
            <input type="email" x-model="form.customer_email" placeholder="jhon@gmail.com"
              class="input-field w-full rounded-lg px-3 py-2.5 text-sm"/>
          </div>
          <div>
            <label class="block mb-1">No. HP Customer</label>
            <input type="text" x-model="form.customer_phone" placeholder="08xxxxxxxxxx"
              class="input-field w-full rounded-lg px-3 py-2.5 text-sm font-mono"/>
          </div>
          <div>
            <label class="block mb-1">Deskripsi Item</label>
            <input type="text" x-model="form.item_details" placeholder="Pembelian produk kamera"
              class="input-field w-full rounded-lg px-3 py-2.5 text-sm"/>
          </div>
          <div class="flex items-center gap-3 pt-1">
            <button @click="form.payment_guide = !form.payment_guide"
              :class="form.payment_guide ? 'bg-green-500' : 'bg-slate-700'"
              class="relative inline-flex h-5 w-9 rounded-full transition-colors cursor-pointer">
              <span :class="form.payment_guide ? 'translate-x-4' : 'translate-x-0.5'"
                class="inline-block h-4 w-4 mt-0.5 rounded-full bg-white transition-transform shadow"></span>
            </button>
            <span class="text-sm text-slate-300">Tampilkan Payment Guide <span class="text-slate-500 text-xs">(optional)</span></span>
          </div>
        </div>
      </div>

      <!-- Error -->
      <div x-show="error" x-transition class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm" x-text="error"></div>

      <!-- Submit -->
      <button @click="submit()" :disabled="loading"
        class="btn-pay w-full py-3 rounded-xl text-white font-semibold text-sm flex items-center justify-center gap-2">
        <span x-show="loading">
          <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
          </svg>
        </span>
        <span x-show="!loading">⚡</span>
        <span x-text="loading ? 'Memproses...' : 'Buat Pembayaran'"></span>
      </button>

    </div>

    <!-- RESULT CARD -->
    <div x-show="result" x-transition class="result-card glass rounded-2xl p-6">

      <!-- Header -->
      <div class="flex items-center justify-between mb-5">
        <div>
          <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs method-badge font-mono mb-1">
            <span class="pulse-dot inline-block w-1.5 h-1.5 rounded-full bg-green-400"></span>
            <span x-text="result?.data?.status?.toUpperCase()"></span>
          </div>
          <h2 class="text-lg font-bold text-white">Transaksi Berhasil Dibuat</h2>
        </div>
        <button @click="reset()" class="text-slate-400 hover:text-white transition-colors text-xs border border-white/10 px-3 py-1.5 rounded-lg hover:bg-white/5">
          ← Buat Baru
        </button>
      </div>

      <!-- Transaction Detail -->
      <div class="space-y-2 mb-5">
        <template x-for="[key, val] in Object.entries({
          'Transaction ID': result?.data?.transaction_id,
          'Reference ID': result?.data?.reference_id,
          'Metode': result?.data?.payment_method,
          'Status': result?.data?.status,
        })">
          <div class="flex justify-between items-center py-2 border-b border-white/5 text-sm">
            <span class="text-slate-400" x-text="key"></span>
            <span class="text-white font-mono text-xs" x-text="val"></span>
          </div>
        </template>

        <!-- Amount rows -->
        <div class="flex justify-between items-center py-2 border-b border-white/5 text-sm">
          <span class="text-slate-400">Nominal</span>
          <span class="text-white font-mono text-xs" x-text="'Rp ' + (result?.data?.amount||0).toLocaleString('id-ID')"></span>
        </div>
        <div class="flex justify-between items-center py-2 border-b border-white/5 text-sm">
          <span class="text-slate-400">Biaya Admin</span>
          <span class="text-white font-mono text-xs" x-text="'Rp ' + (result?.data?.fee||0).toLocaleString('id-ID')"></span>
        </div>
        <div class="flex justify-between items-center py-2 text-sm">
          <span class="text-green-400 font-semibold">Total Bayar</span>
          <span class="text-green-400 font-bold font-mono" x-text="'Rp ' + (result?.data?.total_payment||0).toLocaleString('id-ID')"></span>
        </div>
      </div>

      <!-- Dynamic Payment Display -->
      <div class="mb-4">
        
        <!-- Jika E-Wallet (Link) -->
        <template x-if="isEwallet()">
          <div>
            <label class="block mb-2">Link Pembayaran E-Wallet</label>
            <a :href="getPaymentUrl()" target="_blank" class="btn-pay block text-center w-full py-3 rounded-xl text-white font-semibold text-sm">
              Buka Link Pembayaran
            </a>
          </div>
        </template>

        <!-- Jika QRIS (Image) -->
        <template x-if="isQris() && !isEwallet()">
          <div>
            <label class="block mb-2">Scan QRIS</label>
            <div class="bg-white p-4 rounded-xl inline-block mx-auto flex justify-center mb-3">
              <img :src="'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(result?.data?.payment_code || '')" alt="QRIS" class="w-48 h-48 mx-auto"/>
            </div>
            <!-- Teks QRIS Copy -->
            <div class="relative mt-1">
              <div class="input-field rounded-lg p-3 qr-code-text text-green-300 max-h-28 overflow-y-auto" x-text="result?.data?.payment_code"></div>
              <button @click="copyCode(result?.data?.payment_code)"
                class="absolute top-2 right-2 px-2 py-1 text-xs rounded bg-green-500/20 text-green-400 hover:bg-green-500/30 transition-colors"
                x-text="copied ? '✓ Copied' : 'Copy'">
              </button>
            </div>
          </div>
        </template>

        <!-- Jika VA / Retail (Teks VA Number) -->
        <template x-if="!isEwallet() && !isQris() && result?.data?.payment_code">
          <div>
            <label class="block mb-2">Payment Code / VA Number</label>
            <div class="relative">
              <div class="input-field rounded-lg p-3 qr-code-text text-green-300 max-h-28 overflow-y-auto" x-text="result?.data?.payment_code"></div>
              <button @click="copyCode(result?.data?.payment_code)"
                class="absolute top-2 right-2 px-2 py-1 text-xs rounded bg-green-500/20 text-green-400 hover:bg-green-500/30 transition-colors"
                x-text="copied ? '✓ Copied' : 'Copy'">
              </button>
            </div>
          </div>
        </template>
      </div>

      <!-- Payment Guide -->
      <div x-show="result?.data?.payment_guide" class="mt-4">
        <label class="block mb-2">📖 Panduan Pembayaran</label>
        <div class="input-field rounded-lg p-4 text-sm text-slate-300 leading-relaxed prose-sm max-h-64 overflow-y-auto"
          x-html="result?.data?.payment_guide">
        </div>
      </div>

    </div>

    <!-- Footer -->
    <p class="text-center text-slate-600 text-xs mt-6 font-mono">
      Payment Gateway API
    </p>
  </div>

  <script>
    function paymentApp() {
      return {
        form: {
          bank_code: '',
          amount: '',
          customer_name: '',
          customer_email: '',
          customer_phone: '',
          payment_guide: true,
          item_details: '',
        },
        loading: false,
        error: '',
        result: null,
        copied: false,

        isQris() {
          const method = (this.result?.data?.payment_method || '').toUpperCase();
          const code = (this.form.bank_code || '').toUpperCase();
          return method.includes('QRIS') || code === 'SP' || code === 'NQ';
        },

        isEwallet() {
          if (!this.result?.data) return false;
          // Kalau ada URL eksplisit
          if (this.result.data.checkout_url || this.result.data.payment_url) return true;
          // Kalau payment code berupa URL
          if (this.result.data.payment_code && String(this.result.data.payment_code).startsWith('http')) return true;
          
          const method = (this.result.data.payment_method || '').toUpperCase();
          const code = (this.form.bank_code || '').toUpperCase();
          const ewallets = ['DA', 'OV', 'LA', 'SA', 'SHOPEEPAY', 'GOPAY', 'VIRGO'];
          return ewallets.includes(code) || method.includes('WALLET') || method.includes('OVO') || method.includes('DANA') || method.includes('SHOPEEPAY') || method.includes('LINKAJA');
        },

        getPaymentUrl() {
          if (!this.result?.data) return '#';
          return this.result.data.checkout_url || this.result.data.payment_url || this.result.data.payment_code;
        },

        validate() {
          const f = this.form;
          if (!f.bank_code)      return 'Metode pembayaran wajib dipilih';
          if (!f.amount || isNaN(f.amount) || +f.amount < 1) return 'Jumlah tidak valid';
          if (!f.customer_name)  return 'Nama customer wajib diisi';
          if (!f.customer_email) return 'Email customer wajib diisi';
          if (!f.customer_phone) return 'No. HP customer wajib diisi';
          if (!f.item_details)   return 'Deskripsi item wajib diisi';
          return null;
        },

        async submit() {
          this.error = '';
          const err = this.validate();
          if (err) { this.error = err; return; }

          this.loading = true;
          try {
            const payload = {
              ...this.form,
              payment_guide: this.form.payment_guide ? 'true' : 'false',
              amount: String(this.form.amount),
            };

            const res = await axios.post('process.php', payload, {
              headers: { 'Content-Type': 'application/json' }
            });

            if (res.data.success) {
              this.result = res.data;
            } else {
              this.error = res.data.msg || 'Terjadi kesalahan dari server.';
            }
          } catch (e) {
            if (e.response?.data?.msg) {
              this.error = e.response.data.msg;
            } else {
              this.error = 'Gagal terhubung ke server. Pastikan process.php berjalan.';
            }
          } finally {
            this.loading = false;
          }
        },

        reset() {
          this.result = null;
          this.error = '';
        },

        async copyCode(text) {
          try {
            await navigator.clipboard.writeText(text);
            this.copied = true;
            setTimeout(() => this.copied = false, 2000);
          } catch(e) {}
        }
      }
    }
  </script>
</body>
</html>
