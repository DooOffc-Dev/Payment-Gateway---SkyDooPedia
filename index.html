<!DOCTYPE html>
<html lang="id" x-data="paymentApp()" :class="darkMode ? 'dark' : ''">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Gateway - DooPedia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['Space Mono', 'monospace'],
          },
          colors: {
            brand: {
              50:  '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>

  <style>
    body { background: #0f172a; transition: background 0.3s ease, color 0.3s ease; }
    body.light { background: #f8fafc; }

    .glass {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      transition: background 0.3s, border-color 0.3s;
    }
    .light .glass {
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 8px 32px rgba(0,0,0,0.04);
    }

    .input-field {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #f1f5f9;
      transition: border-color .2s, box-shadow .2s, background .3s, color .3s;
    }
    .input-field:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.15);
    }
    .input-field::placeholder { color: #475569; }
    .light .input-field {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      color: #0f172a;
    }
    .light .input-field::placeholder { color: #94a3b8; }
    .light .input-field:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.2);
    }

    .select-field {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #f1f5f9;
      transition: background .3s, border-color .3s, color .3s;
    }
    .select-field:focus {
      outline: none;
      border-color: #22c55e;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.15);
    }
    .select-field option { background: #1e293b; color: #f1f5f9; }
    .light .select-field {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      color: #0f172a;
    }
    .light .select-field option { background: #ffffff; color: #0f172a; }

    .btn-pay {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      transition: all .2s;
      box-shadow: 0 4px 20px rgba(34,197,94,0.3);
    }
    .btn-pay:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(34,197,94,0.4);
    }
    .btn-pay:disabled { opacity: .5; cursor: not-allowed; }

    .method-badge {
      background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.2);
      color: #4ade80;
    }
    .light .method-badge {
      background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.15);
      color: #15803d;
    }

    .result-card { animation: slideUp .4s ease; }
    @keyframes slideUp {
      from { opacity:0; transform: translateY(16px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .pulse-dot { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .4; }
    }

    .qr-code-text {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      word-break: break-all;
      line-height: 1.5;
    }

    .light h1, .light h2, .light label, .light .text-slate-300, .light .text-slate-400 { color: #0f172a !important; }
    .light .text-slate-500 { color: #475569 !important; }
    .light .text-slate-600 { color: #64748b !important; }
    .light .text-green-400 { color: #16a34a !important; }
    .light .text-green-300 { color: #15803d !important; }

    .mode-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 50;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      color: #f1f5f9;
    }
    .light .mode-toggle {
      background: rgba(0,0,0,0.05);
      border: 1px solid rgba(0,0,0,0.08);
      color: #0f172a;
    }
    .mode-toggle:hover {
      transform: scale(1.05);
      background: rgba(255,255,255,0.15);
    }
    .light .mode-toggle:hover {
      background: rgba(0,0,0,0.08);
    }
    .mode-toggle svg { width: 22px; height: 22px; }
  </style>
</head>

<body class="font-sans min-h-screen flex items-start justify-center py-12 px-4" :class="darkMode ? '' : 'light'">

  <button @click="darkMode = !darkMode" class="mode-toggle" aria-label="Toggle theme">
    <template x-if="darkMode">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
    </template>
    <template x-if="!darkMode">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
    </template>
  </button>

  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 rounded-full" :class="darkMode ? 'bg-green-500/5' : 'bg-green-500/10'"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 rounded-full" :class="darkMode ? 'bg-blue-500/5' : 'bg-blue-500/10'"></div>
  </div>

  <div class="w-full max-w-lg relative z-10">
    <div class="mb-8 text-center">
      <div class="inline-flex items-center gap-2 mb-3 px-3 py-1 rounded-full text-xs font-mono method-badge">
        <span class="pulse-dot inline-block w-1.5 h-1.5 rounded-full bg-green-400"></span>
        PAYMENT GATEWAY
      </div>
      <h1 class="text-3xl font-bold tracking-tight" :class="darkMode ? 'text-white' : 'text-slate-900'">Buat Transaksi</h1>
      <p class="mt-1 text-sm" :class="darkMode ? 'text-slate-400' : 'text-slate-500'">Isi form di bawah untuk membuat pembayaran baru</p>
    </div>

    <div class="glass rounded-2xl p-6 mb-5" x-show="!result">
      <div class="mb-5 pb-5 border-b" :class="darkMode ? 'border-white/5' : 'border-black/5'">
        <p class="text-xs font-mono text-green-400 mb-3 uppercase tracking-widest">💳 Metode Pembayaran</p>
        <div>
          <label class="block mb-1" :class="darkMode ? 'text-slate-400' : 'text-slate-600'">Bank / E-Wallet / QRIS</label>
          <select x-model="form.bank_code" class="select-field w-full rounded-lg px-3 py-2.5 text-sm appearance-none cursor-pointer">
            <option value="">-- Pilih Metode --</option>
            <optgroup label="QRIS">
              <option value="SP">QRIS</option>
              <option value="NQ">QRIS 2</option>
            </optgroup>
            <optgroup label="E-Wallet">
              <option value="DA">DANA</option>
              <option value="OV">OVO</option>
              <option value="LA">LinkAja</option>
              <option value="SA">ShopeePay</option>
              <option value="SHOPEEPAY">SHOPEEPAY2</option>
              <option value="GOPAY">GOPAY</option>
              <option value="VIRGO">VIRGO</option>
            </optgroup>
            <optgroup label="Bank Virtual Account">
              <option value="BR">BRI</option>
              <option value="BCAVA">BCA</option>
              <option value="I1">BNI</option>
              <option value="M2">Mandiri</option>
              <option value="BT">Permata</option>
              <option value="VA">Maybank</option>
              <option value="DM">Danamon</option>
              <option value="B1">CIMB Niaga</option>
              <option value="NC">NeoBank</option>
              <option value="A1">ATM Bersama</option>
              <option value="BV">BSI</option>
            </optgroup>
            <optgroup label="Retail">
              <option value="FT">Pegadaian / ALFA / Pos</option>
              <option value="INDOMARET">INDOMARET</option>
            </optgroup>
          </select>
        </div>
      </div>

      <div class="mb-5 pb-5 border-b" :class="darkMode ? 'border-white/5' : 'border-black/5'">
        <p class="text-xs font-mono text-green-400 mb-3 uppercase tracking-widest">👤 Data Transaksi</p>
        <div class="grid grid-cols-1 gap-3">
          <div>
            <label class="block mb-1" :class="darkMode ? 'text-slate-400' : 'text-slate-600'">Jumlah (Rp)</label>
            <input type="number" x-model="form.amount" placeholder="Contoh: 100000" class="input-field w-full rounded-lg px-3 py-2.5 text-sm"/>
          </div>
          <div>
            <label class="block mb-1" :class="darkMode ? 'text-slate-400' : 'text-slate-600'">Nama Customer</label>
            <input type="text" x-model="form.customer_name" placeholder="Jhon Doe" class="input-field w-full rounded-lg px-3 py-2.5 text-sm"/>
          </div>
          <div>
            <label class="block mb-1" :class="darkMode ? 'text-slate-400' : 'text-slate-600'">Email Customer</label>
            <input type="email" x-model="form.customer_email" placeholder="jhon@gmail.com" class="input-field w-full rounded-lg px-3 py-2.5 text-sm"/>
          </div>
          <div>
            <label class="block mb-1" :class="darkMode ? 'text-slate-400' : 'text-slate-600'">No. HP Customer</label>
            <input type="text" x-model="form.customer_phone" placeholder="08xxxxxxxxxx" class="input-field w-full rounded-lg px-3 py-2.5 text-sm font-mono"/>
          </div>
          <div>
            <label class="block mb-1" :class="darkMode ? 'text-slate-400' : 'text-slate-600'">Deskripsi Item</label>
            <input type="text" x-model="form.item_details" placeholder="Pembelian produk kamera" class="input-field w-full rounded-lg px-3 py-2.5 text-sm"/>
          </div>
          <div class="flex items-center gap-3 pt-1">
            <button @click="form.payment_guide = !form.payment_guide"
              :class="form.payment_guide ? 'bg-green-500' : (darkMode ? 'bg-slate-700' : 'bg-slate-300')"
              class="relative inline-flex h-5 w-9 rounded-full transition-colors cursor-pointer">
              <span :class="form.payment_guide ? 'translate-x-4' : 'translate-x-0.5'" class="inline-block h-4 w-4 mt-0.5 rounded-full bg-white transition-transform shadow"></span>
            </button>
            <span class="text-sm" :class="darkMode ? 'text-slate-300' : 'text-slate-700'">Tampilkan Payment Guide <span class="text-xs" :class="darkMode ? 'text-slate-500' : 'text-slate-400'">(optional)</span></span>
          </div>
        </div>
      </div>

      <div x-show="error" x-transition class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm" x-text="error"></div>

      <button @click="submit()" :disabled="loading" class="btn-pay w-full py-3 rounded-xl text-white font-semibold text-sm flex items-center justify-center gap-2">
        <span x-show="loading">
          <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
          </svg>
        </span>
        <span x-show="!loading">⚡</span>
        <span x-text="loading ? 'Memproses...' : 'Buat Pembayaran'"></span>
      </button>
    </div>

    <div x-show="result" x-transition class="result-card glass rounded-2xl p-6">
      <div class="flex items-center justify-between mb-5">
        <div>
          <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs method-badge font-mono mb-1">
            <span class="pulse-dot inline-block w-1.5 h-1.5 rounded-full bg-green-400"></span>
            <span x-text="result?.data?.status?.toUpperCase()"></span>
          </div>
          <h2 class="text-lg font-bold" :class="darkMode ? 'text-white' : 'text-slate-900'">Transaksi Berhasil Dibuat</h2>
        </div>
        <button @click="reset()" class="px-3 py-1.5 rounded-lg text-xs border transition-colors"
          :class="darkMode ? 'text-slate-400 border-white/10 hover:bg-white/5 hover:text-white' : 'text-slate-600 border-black/10 hover:bg-black/5 hover:text-black'">
          ← Buat Baru
        </button>
      </div>

      <div class="space-y-2 mb-5">
        <template x-for="[key, val] in Object.entries({
          'Transaction ID': result?.data?.transaction_id,
          'Reference ID': result?.data?.reference_id,
          'Metode': result?.data?.payment_method,
          'Status': result?.data?.status,
        })">
          <div class="flex justify-between items-center py-2 border-b text-sm" :class="darkMode ? 'border-white/5' : 'border-black/5'">
            <span class="text-slate-400" x-text="key"></span>
            <span class="font-mono text-xs" :class="darkMode ? 'text-white' : 'text-slate-900'" x-text="val"></span>
          </div>
        </template>
        <div class="flex justify-between items-center py-2 border-b text-sm" :class="darkMode ? 'border-white/5' : 'border-black/5'">
          <span class="text-slate-400">Nominal</span>
          <span class="font-mono text-xs" :class="darkMode ? 'text-white' : 'text-slate-900'" x-text="'Rp ' + (result?.data?.amount||0).toLocaleString('id-ID')"></span>
        </div>
        <div class="flex justify-between items-center py-2 border-b text-sm" :class="darkMode ? 'border-white/5' : 'border-black/5'">
          <span class="text-slate-400">Biaya Admin</span>
          <span class="font-mono text-xs" :class="darkMode ? 'text-white' : 'text-slate-900'" x-text="'Rp ' + (result?.data?.fee||0).toLocaleString('id-ID')"></span>
        </div>
        <div class="flex justify-between items-center py-2 text-sm">
          <span class="text-green-400 font-semibold">Total Bayar</span>
          <span class="text-green-400 font-bold font-mono" x-text="'Rp ' + (result?.data?.total_payment||0).toLocaleString('id-ID')"></span>
        </div>
      </div>

      <div class="mb-4">
        <template x-if="isEwallet()">
          <div>
            <label class="block mb-2" :class="darkMode ? 'text-slate-400' : 'text-slate-600'">Link Pembayaran E-Wallet</label>
            <a :href="getPaymentUrl()" target="_blank" class="btn-pay block text-center w-full py-3 rounded-xl text-white font-semibold text-sm">
              Buka Link Pembayaran
            </a>
          </div>
        </template>
        <template x-if="isQris() && !isEwallet()">
          <div>
            <label class="block mb-2" :class="darkMode ? 'text-slate-400' : 'text-slate-600'">Scan QRIS</label>
            <div class="p-4 rounded-xl inline-block mx-auto flex justify-center mb-3" :class="darkMode ? 'bg-white' : 'bg-white/80'">
              <img :src="'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' + encodeURIComponent(result?.data?.payment_code || '')" alt="QRIS" class="w-48 h-48 mx-auto"/>
            </div>
            <div class="relative mt-1">
              <div class="input-field rounded-lg p-3 qr-code-text text-green-300 max-h-28 overflow-y-auto" :class="darkMode ? 'text-green-300' : 'text-green-700'" x-text="result?.data?.payment_code"></div>
              <button @click="copyCode(result?.data?.payment_code)" class="absolute top-2 right-2 px-2 py-1 text-xs rounded bg-green-500/20 text-green-400 hover:bg-green-500/30 transition-colors" x-text="copied ? '✓ Copied' : 'Copy'"></button>
            </div>
          </div>
        </template>
        <template x-if="!isEwallet() && !isQris() && result?.data?.payment_code">
          <div>
            <label class="block mb-2" :class="darkMode ? 'text-slate-400' : 'text-slate-600'">Payment Code / VA Number</label>
            <div class="relative">
              <div class="input-field rounded-lg p-3 qr-code-text text-green-300 max-h-28 overflow-y-auto" :class="darkMode ? 'text-green-300' : 'text-green-700'" x-text="result?.data?.payment_code"></div>
              <button @click="copyCode(result?.data?.payment_code)" class="absolute top-2 right-2 px-2 py-1 text-xs rounded bg-green-500/20 text-green-400 hover:bg-green-500/30 transition-colors" x-text="copied ? '✓ Copied' : 'Copy'"></button>
            </div>
          </div>
        </template>
      </div>

      <div x-show="result?.data?.payment_guide" class="mt-4">
        <label class="block mb-2" :class="darkMode ? 'text-slate-400' : 'text-slate-600'">📖 Panduan Pembayaran</label>
        <div class="input-field rounded-lg p-4 text-sm leading-relaxed prose-sm max-h-64 overflow-y-auto"
          :class="darkMode ? 'text-slate-300' : 'text-slate-700'" x-html="result?.data?.payment_guide"></div>
      </div>
    </div>

    <p class="text-center text-xs mt-6 font-mono" :class="darkMode ? 'text-slate-600' : 'text-slate-400'">Payment Gateway API</p>
  </div>

  <script>
    function paymentApp() {
      return {
        darkMode: true,
        form: {
          bank_code: '',
          amount: '',
          customer_name: '',
          customer_email: '',
          customer_phone: '',
          payment_guide: true,
          item_details: '',
        },
        loading: false,
        error: '',
        result: null,
        copied: false,

        isQris() {
          const method = (this.result?.data?.payment_method || '').toUpperCase();
          const code = (this.form.bank_code || '').toUpperCase();
          return method.includes('QRIS') || code === 'SP' || code === 'NQ';
        },

        isEwallet() {
          if (!this.result?.data) return false;
          if (this.result.data.checkout_url || this.result.data.payment_url) return true;
          if (this.result.data.payment_code && String(this.result.data.payment_code).startsWith('http')) return true;
          const method = (this.result.data.payment_method || '').toUpperCase();
          const code = (this.form.bank_code || '').toUpperCase();
          const ewallets = ['DA', 'OV', 'LA', 'SA', 'SHOPEEPAY', 'GOPAY', 'VIRGO'];
          return ewallets.includes(code) || method.includes('WALLET') || method.includes('OVO') || method.includes('DANA') || method.includes('SHOPEEPAY') || method.includes('LINKAJA');
        },

        getPaymentUrl() {
          if (!this.result?.data) return '#';
          return this.result.data.checkout_url || this.result.data.payment_url || this.result.data.payment_code;
        },

        validate() {
          const f = this.form;
          if (!f.bank_code) return 'Metode pembayaran wajib dipilih';
          if (!f.amount || isNaN(f.amount) || +f.amount < 1) return 'Jumlah tidak valid';
          if (!f.customer_name) return 'Nama customer wajib diisi';
          if (!f.customer_email) return 'Email customer wajib diisi';
          if (!f.customer_phone) return 'No. HP customer wajib diisi';
          if (!f.item_details) return 'Deskripsi item wajib diisi';
          return null;
        },

        async submit() {
          this.error = '';
          const err = this.validate();
          if (err) { this.error = err; return; }

          this.loading = true;
          try {
            const payload = {
              bank_code: this.form.bank_code,
              amount: String(this.form.amount),
              customer_name: this.form.customer_name,
              customer_email: this.form.customer_email,
              customer_phone: this.form.customer_phone,
              payment_guide: this.form.payment_guide ? 'true' : 'false',
              item_details: this.form.item_details,
            };

            const res = await axios.post('/api/process', payload, {
              headers: { 'Content-Type': 'application/json' }
            });

            if (res.data.success) {
              this.result = res.data;
            } else {
              this.error = res.data.msg || 'Terjadi kesalahan dari server.';
            }
          } catch (e) {
            if (e.response?.data?.msg) {
              this.error = e.response.data.msg;
            } else {
              this.error = 'Gagal terhubung ke server. Pastikan backend di Vercel sudah jalan.';
            }
          } finally {
            this.loading = false;
          }
        },

        reset() {
          this.result = null;
          this.error = '';
        },

        async copyCode(text) {
          try {
            await navigator.clipboard.writeText(text);
            this.copied = true;
            setTimeout(() => this.copied = false, 2000);
          } catch(e) {}
        }
      }
    }
  </script>
</body>
</html>
